    <text x="420" y="83">2. Diseño</text>
    <text x="700" y="83">3. Desarrollo</text>
    <text x="980" y="83">4. Implementación</text>
    <text x="1260" y="83">5. Evaluación</text>
  </g>
  <g stroke="#222" stroke-width="2.2" marker-end="url(#f)">
