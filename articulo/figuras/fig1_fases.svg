    <rect x="300" y="125" width="240" height="170" rx="8"/>
    <rect x="580" y="125" width="240" height="170" rx="8"/>
    <rect x="860" y="125" width="240" height="170" rx="8"/>
    <rect x="1140" y="125" width="240" height="170" rx="8"/>
  </g>
  <g font-size="17" fill="#333">
    <text x="36" y="158">Usuario: turista y</text>
    <text x="36" y="180">estudiante</text>
    <text x="36" y="208">Selección de platos</text>
    <text x="36" y="230">por región</text>
    <text x="36" y="258">Requerimientos y</text>
    <text x="36" y="280">celulares con ARCore</text>

    <text x="316" y="158">Arquitectura web</text>
    <text x="316" y="186">Ficha JSON del plato</text>
    <text x="316" y="214">Un GLB por paso,</text>
    <text x="316" y="236">en metros</text>
    <text x="316" y="264">Prompt y esquema</text>
    <text x="316" y="286">de respuesta</text>

    <text x="596" y="158">Modelos 3D por</text>
    <text x="596" y="180">script (trimesh)</text>
    <text x="596" y="208">Angular 22 con</text>
    <text x="596" y="230">model-viewer</text>
    <text x="596" y="258">FastAPI y Gemini</text>
    <text x="596" y="286">con salida JSON</text>

    <text x="876" y="158">Docker Compose</text>
    <text x="876" y="180">con Nginx</text>
    <text x="876" y="208">GitHub Actions</text>
    <text x="876" y="236">Túnel HTTPS para</text>
    <text x="876" y="258">probar AR en el</text>
