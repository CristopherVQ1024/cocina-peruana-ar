    <line x1="540" y1="75" x2="576" y2="75"/>
    <line x1="820" y1="75" x2="856" y2="75"/>
    <line x1="1100" y1="75" x2="1136" y2="75"/>
  </g>

  <g stroke="#bbb" stroke-width="1.5" fill="#fafafa">
