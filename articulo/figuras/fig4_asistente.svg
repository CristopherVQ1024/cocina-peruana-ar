<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" font-family="Liberation Sans, Arial, sans-serif">
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
    <marker id="fr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9a3412"/>
    </marker>
  </defs>
  <rect width="1400" height="520" fill="#fff"/>

  <text x="20" y="32" font-size="19" font-weight="bold" fill="#222">a) Pregunta al guía</text>
  <g stroke="#222" stroke-width="2" fill="#fff">
    <rect x="20" y="50" width="230" height="170" rx="10"/>
    <rect x="290" y="50" width="270" height="170" rx="10"/>
    <rect x="600" y="50" width="250" height="170" rx="10" fill="#fdf1e7"/>
    <rect x="890" y="50" width="220" height="170" rx="10"/>
    <rect x="1150" y="50" width="230" height="170" rx="10"/>
  </g>
  <g stroke="#222" stroke-width="2.2" marker-end="url(#f)">
    <line x1="250" y1="135" x2="286" y2="135"/>
    <line x1="560" y1="135" x2="596" y2="135"/>
    <line x1="850" y1="135" x2="886" y2="135"/>
    <line x1="1110" y1="135" x2="1146" y2="135"/>
  </g>
  <g fill="#222" text-anchor="middle" font-weight="bold" font-size="19">
    <text x="135" y="82">Interfaz</text>
    <text x="425" y="82">Backend arma el contexto</text>
    <text x="725" y="82">Gemini</text>
    <text x="1000" y="82">Validación</text>
    <text x="1265" y="82">Interfaz</text>
  </g>
  <g font-size="15.5" fill="#333">
    <text x="34" y="112">pregunta (≤ 500 car.)</text>
    <text x="34" y="134">idioma: es, en, pt, fr</text>
    <text x="34" y="156">paso que se ve</text>
    <text x="34" y="178">historial (≤ 10)</text>
    <text x="304" y="112">ficha completa del plato</text>
    <text x="304" y="134">en JSON</text>
    <text x="304" y="156">«el usuario ve el paso N»</text>
    <text x="304" y="178">instrucciones: usar solo</text>
    <text x="304" y="200">la ficha, ≤ 120 palabras</text>
    <text x="614" y="112">temperatura 0.3</text>
    <text x="614" y="134">response_schema:</text>
    <text x="614" y="156">{respuesta,</text>
    <text x="614" y="178"> fuera_de_ficha}</text>
    <text x="904" y="112">Pydantic</text>
    <text x="904" y="134">RespuestaAsistente</text>
    <text x="904" y="166">si falla: 502 y</text>
    <text x="904" y="188">mensaje de error</text>
    <text x="1164" y="112">burbuja de respuesta</text>
    <text x="1164" y="134">fuera de ficha:</text>
    <text x="1164" y="156">estilo distinto y</text>
    <text x="1164" y="178">pregunta sugerida</text>
  </g>

  <text x="20" y="282" font-size="19" font-weight="bold" fill="#222">b) Traducción de la ficha</text>
  <g stroke="#222" stroke-width="2" fill="#fff">
    <rect x="20" y="300" width="230" height="170" rx="10"/>
    <rect x="290" y="300" width="270" height="170" rx="10"/>
    <rect x="600" y="300" width="250" height="170" rx="10" fill="#fdf1e7"/>
    <rect x="890" y="300" width="220" height="170" rx="10"/>
    <rect x="1150" y="300" width="230" height="170" rx="10"/>
  </g>
  <g stroke="#222" stroke-width="2.2" marker-end="url(#f)">
    <line x1="250" y1="385" x2="286" y2="385"/>
    <line x1="560" y1="385" x2="596" y2="385"/>
    <line x1="850" y1="385" x2="886" y2="385"/>
    <line x1="1110" y1="385" x2="1146" y2="385"/>
  </g>
  <path d="M425,470 L425,500 L1265,500 L1265,474" fill="none" stroke="#9a3412" stroke-width="2.2" stroke-dasharray="8 6" marker-end="url(#fr)"/>
  <text x="845" y="494" font-size="15.5" fill="#9a3412" text-anchor="middle">si ya está en caché, se devuelve sin llamar al modelo</text>
  <g fill="#222" text-anchor="middle" font-weight="bold" font-size="19">
    <text x="135" y="332">Interfaz</text>
    <text x="425" y="332">Caché en memoria</text>
    <text x="725" y="332">Gemini</text>
    <text x="1000" y="332">Restauración</text>
    <text x="1265" y="332">Ficha traducida</text>
  </g>
  <g font-size="15.5" fill="#333">
    <text x="34" y="362">cambia el idioma en</text>
    <text x="34" y="384">el selector</text>
    <text x="34" y="406">GET /api/platos/{id}</text>
    <text x="34" y="428">?idioma=en</text>
    <text x="304" y="362">clave (plato, idioma)</text>
    <text x="304" y="394">se guarda cada ficha</text>
    <text x="304" y="416">traducida</text>
    <text x="614" y="362">temperatura 0.1</text>
    <text x="614" y="384">response_schema:</text>
    <text x="614" y="406">Plato</text>
    <text x="614" y="438">nombres típicos sin</text>
    <text x="614" y="460">traducir, con nota</text>
    <text x="904" y="362">id, nombre, número,</text>
    <text x="904" y="384">minutos y modelo se</text>
    <text x="904" y="406">copian del original</text>
    <text x="1164" y="362">misma estructura</text>
    <text x="1164" y="384">misma ruta de GLB</text>
    <text x="1164" y="406">por paso</text>
  </g>
</svg>
