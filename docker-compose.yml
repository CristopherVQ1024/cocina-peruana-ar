services:
  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/salud')"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build: ./frontend
    ports:
      - "${WEB_PORT:-8090}:80"
    depends_on:
      - backend
    restart: unless-stopped
